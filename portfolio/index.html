<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171a18" />
  <title>Traïan Beaujard — Robotics & Creative Engineering</title>
  <meta name="description" content="Traïan Beaujard builds autonomous robots, computer-vision systems, games, and playful software." />
  <meta property="og:title" content="Traïan Beaujard Portfolio" />
  <meta property="og:description" content="Robotics, computer vision, research, games, and playful systems." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="img/pdp/banner.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
  <link href="output.css" rel="stylesheet" />
  <script type="module" src="js/enhanced_portfolio.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#projects">Skip to projects</a>
  <div class="noise" aria-hidden="true"></div>

  <main class="scene-stack">
    <section class="scene identity-scene" id="home" data-scene="home" aria-labelledby="identity-title">
      <figure class="identity-photo" data-parallax="back">
        <img src="img/pdp/banner.jpg" alt="Traïan Beaujard celebrating with the French flag at WorldSkills Lyon" />
      </figure>
      <div class="identity-light" aria-hidden="true">
        <span class="identity-aura"></span>
        <span class="identity-spotlight identity-spotlight-left"></span>
        <span class="identity-spotlight identity-spotlight-right"></span>
      </div>

      <p class="identity-label" aria-hidden="true">Portfolio</p>
      <h1 class="identity-name" id="identity-title" data-parallax="name">
        <span>TRAÏAN</span>
        <span>BEAUJARD</span>
      </h1>

      <div class="identity-person" data-parallax="front" aria-hidden="true">
        <img src="img/pdp/banner_foreground.png" alt="" />
      </div>

      <nav class="career-timeline" aria-label="Career milestones">
        <svg class="timeline-curve" viewBox="0 0 80 620" preserveAspectRatio="none" aria-hidden="true">
          <path d="M26 0 C68 98 8 205 39 310 C68 410 10 506 54 620" />
        </svg>
        <ol id="timeline-list"></ol>
      </nav>

      <aside class="contact-rail" aria-label="Contact links">
        <span class="contact-heading">Contact</span>
        <button type="button" data-contact-action="email" aria-label="Email Traïan" title="Email">
          <img src="img/icons/icon_mail.png" alt="" />
        </button>
        <a href="https://github.com/chaelpix" target="_blank" rel="noopener noreferrer" aria-label="Traïan on GitHub" title="GitHub">
          <img src="img/icons/icon_github_w.png" alt="" />
        </a>
        <a href="https://www.linkedin.com/in/tra%C3%AFan-beaujard-36839322a/" target="_blank" rel="noopener noreferrer" aria-label="Traïan on LinkedIn" title="LinkedIn">
          <img src="img/icons/icon_linkedin.png" alt="" />
        </a>
      </aside>

      <aside class="mobile-contact-icons" aria-label="Contact links">
        <span class="contact-heading">Contact</span>
        <button type="button" data-contact-action="email" aria-label="Email Traïan">
          <img src="img/icons/icon_mail.png" alt="" />
        </button>
        <a href="https://github.com/chaelpix" target="_blank" rel="noopener noreferrer" aria-label="Traïan on GitHub">
          <img src="img/icons/icon_github_w.png" alt="" />
        </a>
        <a href="https://www.linkedin.com/in/tra%C3%AFan-beaujard-36839322a/" target="_blank" rel="noopener noreferrer" aria-label="Traïan on LinkedIn">
          <img src="img/icons/icon_linkedin.png" alt="" />
        </a>
      </aside>

      <button class="scene-control scene-control-down" type="button" data-go-projects aria-label="Explore projects">
        <span>Projects</span>
        <i aria-hidden="true"></i><i aria-hidden="true"></i>
      </button>
    </section>

    <section class="scene project-scene" id="projects" data-scene="projects" aria-labelledby="project-title">
      <div class="project-media-stage" id="project-media-stage" aria-hidden="true"></div>
      <div class="project-stage-shade" aria-hidden="true"></div>

      <button class="scene-control scene-control-up" type="button" data-go-home aria-label="Return to profile">
        <i aria-hidden="true"></i><i aria-hidden="true"></i>
      </button>

      <article class="project-copy" aria-live="polite">
        <p class="project-kicker" id="project-kicker">Highlights</p>
        <h2 id="project-title">Project</h2>
        <p class="project-description" id="project-description"></p>
        <div class="project-meta" id="project-tags" aria-label="Project technologies"></div>
      </article>

      <div class="project-dial" id="project-dial">
        <div class="project-wheel" id="project-wheel" role="listbox" aria-label="Projects"></div>
      </div>

      <aside class="category-orbit" aria-label="Project categories">
        <p class="dial-label">My projects</p>
        <div class="category-filter" role="group" aria-label="Filter projects">
          <button type="button" data-category="all" aria-pressed="false">All</button>
          <button type="button" data-category="highlights" aria-pressed="true">Highlights</button>
          <button type="button" data-category="robotics" aria-pressed="false">Robotics / CV</button>
          <button type="button" data-category="games" aria-pressed="false">Games</button>
          <button type="button" data-category="xr" aria-pressed="false">XR</button>
          <button type="button" data-category="other" aria-pressed="false">Other</button>
        </div>
      </aside>
    </section>
  </main>

  <dialog id="project-dialog" class="project-dialog" aria-labelledby="dialog-title">
    <div class="dialog-shell">
      <header class="dialog-header">
        <span id="dialog-index">CASE STUDY</span>
        <h2 id="dialog-title">Project</h2>
        <button type="button" data-close-dialog aria-label="Close project">Close ×</button>
      </header>
      <div id="dialog-content" class="dialog-content"></div>
    </div>
  </dialog>
</body>
</html>
